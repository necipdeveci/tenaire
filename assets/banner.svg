<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 280" role="img" aria-label="Tenaire">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1B1F27"/>
      <stop offset="1" stop-color="#0E1014"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#EC4B51" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#EC4B51" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="280" rx="20" fill="url(#bg)"/>
  <ellipse cx="600" cy="140" rx="380" ry="170" fill="url(#glow)"/>

  <!-- USB link -->
  <g stroke="#EC4B51" stroke-width="3" stroke-linecap="round" stroke-dasharray="2 12" fill="none">
    <path d="M232 140H372"/>
    <path d="M828 140H950"/>
  </g>

  <!-- Phone -->
  <g transform="translate(150 62)">
    <rect width="82" height="156" rx="14" fill="#171A20" stroke="#3A404C" stroke-width="3"/>
    <rect x="9" y="16" width="64" height="124" rx="5" fill="#0E1014"/>
    <circle cx="41" cy="78" r="15" fill="#EC4B51"/>
    <path d="M36 69.5v17l13.5-8.5z" fill="#fff"/>
  </g>

  <!-- Monitor -->
  <g transform="translate(950 66)">
    <rect width="150" height="104" rx="10" fill="#171A20" stroke="#3A404C" stroke-width="3"/>
    <rect x="10" y="10" width="130" height="84" rx="4" fill="#0E1014"/>
    <circle cx="75" cy="52" r="16" fill="#EC4B51"/>
    <circle cx="75" cy="52" r="7" fill="#fff"/>
    <path d="M60 104h30l6 28H54z" fill="#262A33"/>
    <rect x="40" y="130" width="70" height="8" rx="4" fill="#3A404C"/>
  </g>

  <!-- Wordmark -->
  <g transform="translate(384 96)">
    <rect width="88" height="88" rx="24" fill="#EC4B51"/>
    <circle cx="44" cy="44" r="18" fill="#fff"/>
  </g>
  <text x="498" y="172" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="92" font-weight="600" fill="#EEF0F4" letter-spacing="-1">Tenaire</text>
</svg>
